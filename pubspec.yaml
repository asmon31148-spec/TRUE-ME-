name: trueme
description: "True Me — AI-Powered All-in-One Study App with Sage Companion"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Google Sign-In (for Drive Vault)
  google_sign_in: ^6.2.1

  # Supabase
  supabase_flutter: ^2.8.0

  # Networking & AI APIs
  http: ^1.2.2
  dio: ^5.7.0
  google_generative_ai: ^0.4.6

  # In-App Update & Platform Info
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.0

  # Cloud Storage (User Drive)
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # File Handling
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # PDF Processing & Export
  syncfusion_flutter_pdf: ^26.2.14
  pdf: ^3.11.1
  printing: ^5.13.2
  archive: ^3.6.1

  # Voice & Audio (On-device)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  record: ^5.1.2

  # OCR (On-device ML Kit)
  google_mlkit_text_recognition: ^0.13.0

  # Mind Map Visualization
  graphview: ^1.2.0

  # UI & Media
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2

  # Notifications & Permissions
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1

  # Local Cache & Preferences
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # Environment
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.2
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - .env

dependency_overrides:
  record_platform_interface: 1.1.0


