name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Android Project & Configure Build Settings
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: trueme-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter create . --platforms=android --org com.trueme.study --project-name trueme
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/trueme-release.jks
            echo "Decoded release keystore from GitHub secret."
          fi
          rm -f test/widget_test.dart || true
          if [ -d "assets/icons" ]; then
            cp -r assets/icons/mipmap-* android/app/src/main/res/ || true
            echo "Installed custom True Me app launcher icons into android/app/src/main/res/"
          fi
          # Ensure seamless Ivory launch background during Android cold start
          for bg in android/app/src/main/res/drawable*/launch_background.xml; do
            if [ -f "$bg" ]; then
              sed -i 's/@android:color\/white/#F8F7FC/g' "$bg" || true
            fi
          done
          cp trueme-release.jks android/app/trueme-release.jks || true
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            python3 -c "
          import os
          m_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(m_path):
              with open(m_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('android:label=\"trueme\"', 'android:label=\"True Me\"')
              perms = '\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.CAMERA\"/>\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>'
              if 'REQUEST_INSTALL_PACKAGES' not in content:
                  content = content.replace('<application', perms + '\n    <application')
              if 'android:requestLegacyExternalStorage' not in content:
                  content = content.replace('<application', '<application\n        android:requestLegacyExternalStorage=\"true\"')
              q = '\n    <queries>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:mimeType=\"application/vnd.android.package-archive\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.INSTALL_PACKAGE\" />\n            <data android:mimeType=\"application/vnd.android.package-archive\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <category android:name=\"android.intent.category.BROWSABLE\" />\n            <data android:scheme=\"https\" />\n        </intent>\n    </queries>'
              if '<queries>' not in content:
                  content = content.replace('</manifest>', q + '\n</manifest>')
              with open(m_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Successfully configured AndroidManifest.xml with install permissions and queries')
          "
          fi
          # Sync dynamic build version across pubspec and android build settings
          sed -i "s/^version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i "s/flutter\.versionCode/${{ github.run_number }}/g" android/app/build.gradle.kts
            sed -i 's/flutter\.versionName/"1.0.${{ github.run_number }}"/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
          fi
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties

          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn com.google.mlkit.**
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.android.gms.**
          -keep class com.google.android.gms.** { *; }
          -dontwarn io.flutter.**
          -keep class io.flutter.** { *; }
          EOF

          python3 .github/scripts/patch_gradle.py

      - name: Create .env for Build
        run: |
          cat << 'EOF' > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          MEGA_BRIDGE_URL=${{ secrets.MEGA_BRIDGE_URL }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Legacy Android Plugins for AGP 8 Namespace & CompileSdk
        run: |
          python3 -c "
          import os, re
          cache_dir = os.environ.get('PUB_CACHE', os.path.expanduser('~/.pub-cache'))
          if os.path.exists(cache_dir):
              for root, dirs, files in os.walk(cache_dir):
                  for fname in ['build.gradle', 'build.gradle.kts']:
                      if fname in files:
                          path = os.path.join(root, fname)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  content = f.read()
                              modified = False
                              if ('com.android.library' in content or 'android {' in content) and 'namespace' not in content:
                                  pkg_dir = os.path.dirname(root)
                                  pkg = os.path.basename(pkg_dir).split('-')[0].replace('.', '_').replace('-', '_')
                                  print(f'Injecting namespace for {pkg} in {path}')
                                  content += f'\nandroid {{\n    namespace \"com.plugin.{pkg}\"\n}}\n'
                                  modified = True
                              if re.search(r'\bcompileSdkVersion\b[^\n]*', content):
                                  content = re.sub(r'\bcompileSdkVersion\b[^\n]*', 'compileSdkVersion 36', content)
                                  print(f'Updated compileSdkVersion to 36 in {path}')
                                  modified = True
                              if re.search(r'\bcompileSdk\b[^\n]*', content):
                                  rep = 'compileSdk = 36' if fname.endswith('.kts') else 'compileSdk 36'
                                  content = re.sub(r'\bcompileSdk\b[^\n]*', rep, content)
                                  print(f'Updated compileSdk to 36 in {path}')
                                  modified = True
                              if modified:
                                  with open(path, 'w', encoding='utf-8') as f:
                                      f.write(content)
                          except Exception as e:
                              print(f'Error patching {path}: {e}')
          "

      - name: Analyze Project Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flutter analyze lib --no-fatal-infos > analyze.log 2>&1 || {
            gh release delete debug-analyze --yes || true
            gh release create debug-analyze -t "Debug Analyze" -F analyze.log || true
            cat analyze.log
            exit 1
          }

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android APK (Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_PATH: trueme-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define-from-file=.env --build-name="1.0.${{ github.run_number }}" --build-number=${{ github.run_number }} > build.log 2>&1 || {
            rm -f .env
            gh release delete debug-build --yes || true
            gh release create debug-build -t "Debug Build" -F build.log || true
            cat build.log
            exit 1
          }
          rm -f .env

      - name: Prepare APK for Direct Release
        run: |
          python3 -c "
          import shutil, os
          src = 'build/app/outputs/flutter-apk/app-release.apk'
          dst = 'build/app/outputs/flutter-apk/TrueMe-release.apk'
          if os.path.exists(src) and os.path.abspath(src) != os.path.abspath(dst):
              shutil.copy2(src, dst)
              print('Successfully copied app-release.apk to TrueMe-release.apk')
          "
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trueme-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          num = '${{ github.run_number }}'
          repo = '${{ github.repository }}'
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(f'### TrueMe Android Release (Build #{num})\n\nDirect .apk download (ready to install directly on Android):\n- **[TrueMe-release.apk](https://github.com/{repo}/releases/download/v1.0.{num}/TrueMe-release.apk)**\n')
          "
          TAG="v1.0.${{ github.run_number }}"
          APK="build/app/outputs/flutter-apk/TrueMe-release.apk"
          for attempt in 1 2 3; do
            echo "Attempt $attempt publishing release $TAG..." > release.log
            if ! gh release view "$TAG" >> release.log 2>&1; then
              gh release create "$TAG" --title "TrueMe $TAG" -F release_notes.md --latest >> release.log 2>&1 || true
            fi
            if gh release upload "$TAG" "$APK" --clobber >> release.log 2>&1; then
              cat release.log
              exit 0
            fi
            cat release.log || true
            sleep 15
          done
          gh release delete debug-build --yes || true
          gh release create debug-build -t "Debug Release Upload" -F release.log || true
          exit 1
