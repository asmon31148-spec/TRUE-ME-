name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Android Project & Configure Build Settings
        run: |
          flutter create . --platforms=android --org com.trueme.study --project-name trueme
          if [ -d "assets/icons" ]; then
            cp -r assets/icons/mipmap-* android/app/src/main/res/ || true
            echo "Installed custom True Me app launcher icons into android/app/src/main/res/"
          fi
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            sed -i 's/android:label="trueme"/android:label="True Me"/g' "$manifest"
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|g' "$manifest"
            echo "Configured True Me label and Android permissions in AndroidManifest.xml"
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/flutter\.versionCode/1/g' android/app/build.gradle.kts
            sed -i 's/flutter\.versionName/"1.0.0"/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
          fi
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties

          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn com.google.mlkit.**
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.android.gms.**
          -keep class com.google.android.gms.** { *; }
          -dontwarn io.flutter.**
          -keep class io.flutter.** { *; }
          EOF

          python3 -c "
          import os

          # Patch Kotlin DSL
          kts_path = 'android/app/build.gradle.kts'
          if os.path.exists(kts_path):
              with open(kts_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'isCoreLibraryDesugaringEnabled' not in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              if 'multiDexEnabled' not in content:
                  content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled = true')
              if 'isMinifyEnabled' not in content:
                  content = content.replace('signingConfig = signingConfigs.getByName(\"debug\")', 'signingConfig = signingConfigs.getByName(\"debug\")\n            isMinifyEnabled = false\n            isShrinkResources = false')
              if 'coreLibraryDesugaring(' not in content:
                  if 'dependencies {' in content:
                      content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")')
                  else:
                      content += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n'
              with open(kts_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Injected desugaring, multiDex, and disabled R8 minification in build.gradle.kts')

          # Patch Groovy
          groovy_path = 'android/app/build.gradle'
          if os.path.exists(groovy_path):
              with open(groovy_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'coreLibraryDesugaringEnabled' not in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              if 'multiDexEnabled' not in content:
                  content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
              if 'minifyEnabled' not in content:
                  content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false')
              if 'coreLibraryDesugaring ' not in content:
                  if 'dependencies {' in content:
                      content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"')
                  else:
                      content += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n'
              with open(groovy_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Injected desugaring, multiDex, and disabled minification in build.gradle')
          "

      - name: Create .env for Build
        run: |
          cat << 'EOF' > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Legacy Android Plugins for AGP 8 Namespace & CompileSdk
        run: |
          python3 -c "
          import os, re
          cache_dir = os.environ.get('PUB_CACHE', os.path.expanduser('~/.pub-cache'))
          if os.path.exists(cache_dir):
              for root, dirs, files in os.walk(cache_dir):
                  for fname in ['build.gradle', 'build.gradle.kts']:
                      if fname in files:
                          path = os.path.join(root, fname)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  content = f.read()
                              modified = False
                              if ('com.android.library' in content or 'android {' in content) and 'namespace' not in content:
                                  pkg_dir = os.path.dirname(root)
                                  pkg = os.path.basename(pkg_dir).split('-')[0].replace('.', '_').replace('-', '_')
                                  print(f'Injecting namespace for {pkg} in {path}')
                                  content += f'\nandroid {{\n    namespace \"com.plugin.{pkg}\"\n}}\n'
                                  modified = True
                              if re.search(r'\bcompileSdkVersion\b[^\n]*', content):
                                  content = re.sub(r'\bcompileSdkVersion\b[^\n]*', 'compileSdkVersion 36', content)
                                  print(f'Updated compileSdkVersion to 36 in {path}')
                                  modified = True
                              if re.search(r'\bcompileSdk\b[^\n]*', content):
                                  rep = 'compileSdk = 36' if fname.endswith('.kts') else 'compileSdk 36'
                                  content = re.sub(r'\bcompileSdk\b[^\n]*', rep, content)
                                  print(f'Updated compileSdk to 36 in {path}')
                                  modified = True
                              if modified:
                                  with open(path, 'w', encoding='utf-8') as f:
                                      f.write(content)
                          except Exception as e:
                              print(f'Error patching {path}: {e}')
          "

      - name: Build Android APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trueme-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Prepare APK for Direct Release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TrueMe-release.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TrueMe v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### 📱 TrueMe Android Release (Build #${{ github.run_number }})
            
            Direct `.apk` download (ready to install directly on Android, no unzipping required):
            - **[TrueMe-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/TrueMe-release.apk)**
          files: |
            build/app/outputs/flutter-apk/TrueMe-release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
