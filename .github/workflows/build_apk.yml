name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Android Project
        run: |
          flutter create . --platforms=android --org com.trueme.study --project-name trueme
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/flutter\.versionCode/1/g' android/app/build.gradle.kts
            sed -i 's/flutter\.versionName/"1.0.0"/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          fi
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties

      - name: Create .env for Build
        run: |
          cat << 'EOF' > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Legacy Android Plugins for AGP 8 Namespace
        run: |
          python3 -c "
          import os
          cache_dir = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          if os.path.exists(cache_dir):
              for root, dirs, files in os.walk(cache_dir):
                  for fname in ['build.gradle', 'build.gradle.kts']:
                      if fname in files:
                          path = os.path.join(root, fname)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  content = f.read()
                              if ('com.android.library' in content or 'android {' in content) and 'namespace' not in content:
                                  pkg_dir = os.path.dirname(root)
                                  pkg = os.path.basename(pkg_dir).split('-')[0].replace('.', '_').replace('-', '_')
                                  print(f'Injecting namespace for {pkg} in {path}')
                                  with open(path, 'a', encoding='utf-8') as f:
                                      f.write(f'\nandroid {{\n    namespace \"com.plugin.{pkg}\"\n}}\n')
                          except Exception as e:
                              print(f'Error patching {path}: {e}')
          "

      - name: Build Android APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trueme-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
